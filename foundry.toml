[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"
bytecode_hash = "none"
cbor_metadata = false

# Детерминированная сборка: без metadata-хвостов, фиксированный solc —
# идентичный байткод всех деплоев (раздел 15 ТЗ)

fuzz = { runs = 512, max_test_rejects = 65536 }
invariant = { runs = 64, depth = 128 }

gas_reports = ["*"]

# AT-траты дороги (LSAG в Solidity ~230M gas на подпись+проверку):
# поднимаем бюджет транзакции/вызова, чтобы 4+ подписи влезали в тест
gas_limit = 8_000_000_000

# Vector export (S1 cross-check): allow writes into ./vectors
fs_permissions = [{ access = "read-write", path = "./vectors" }, { access = "read", path = "./" }]
memory_limit = 4_294_967_296

[rpc_endpoints]
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
base = "${BASE_RPC_URL}"

[profile.ci]
fuzz = { runs = 2048 }
invariant = { runs = 256, depth = 256 }

# Запуск тяжёлых AT-наборов:
#   FOUNDRY_PROFILE=at10 forge test --match-contract "AT10|AT21"   (rebuild/seed: 80G gas)
#   AT-12 запускается в default-профиле (fuzz 512 × 8 шагов).
# AT-10 (rebuild): 50 минтов + 20 трат + 10 конвертов — суммарно ~25B gas.
# Отдельный профиль с увеличенным бюджетом транзакции.
[profile.at10]
gas_limit = 80_000_000_000
memory_limit = 4_294_967_296
